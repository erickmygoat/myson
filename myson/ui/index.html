<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>myson workspace</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --edge:#2a323c;
    --fg:#e6edf3; --dim:#9aa7b4; --accent:#6ea8fe; --good:#3fb950; --bad:#f85149;
    --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  }
  @media (prefers-color-scheme: light):root:not([data-theme="dark"]){
    --bg:#f6f8fa; --panel:#fff; --panel2:#f0f3f6; --edge:#d0d7de;
    --fg:#1f2328; --dim:#636c76; --accent:#0969da;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--edge);background:var(--panel)}
  header h1{font-size:16px;margin:0;letter-spacing:.5px}
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}
  header .dot.on{background:var(--good)}
  header .meta{color:var(--dim);font-size:12px;font-family:var(--mono)}
  .wrap{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;padding:12px;height:calc(100vh - 52px)}
  .col{display:flex;flex-direction:column;gap:12px;min-height:0}
  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:10px;display:flex;flex-direction:column;min-height:0}
  .panel>h2{margin:0;padding:9px 13px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;align-items:center}
  .panel .body{padding:12px 13px;overflow:auto;flex:1;min-height:0}
  #chat{flex:2}
  #scratch{flex:1.3}
  .msg{margin:0 0 12px}
  .msg .who{font-size:11px;color:var(--dim);font-family:var(--mono);margin-bottom:2px}
  .msg.user .bubble{background:var(--panel2);border:1px solid var(--edge)}
  .msg .bubble{padding:8px 11px;border-radius:8px;white-space:pre-wrap;word-wrap:break-word}
  .msg.myson .bubble{background:transparent}
  .composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--edge)}
  textarea{flex:1;resize:none;background:var(--panel2);color:var(--fg);border:1px solid var(--edge);border-radius:8px;padding:8px 10px;font:inherit;min-height:42px;max-height:140px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--edge);padding:4px 10px;font-size:12px;font-weight:500}
  button:disabled{opacity:.5;cursor:default}
  .step{font-family:var(--mono);font-size:12px;border-left:3px solid var(--edge);padding:3px 0 3px 10px;margin:0 0 6px}
  .step.accept{border-color:var(--good)} .step.backtrack{border-color:var(--bad)}
  .step .sc{color:var(--dim)}
  .halt{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:8px}
  .memitem,.review{font-size:13px;border:1px solid var(--edge);border-radius:7px;padding:7px 9px;margin:0 0 7px;background:var(--panel2)}
  .memitem .who{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .review .id{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .review .acts{display:flex;gap:6px;margin-top:6px}
  .empty{color:var(--dim);font-size:13px;font-style:italic}
  .row{display:flex;gap:6px;align-items:center}
  input[type=text]{flex:1;background:var(--panel2);color:var(--fg);border:1px solid var(--edge);border-radius:7px;padding:5px 9px;font:inherit}
  .pill{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--edge);border-radius:20px;padding:1px 8px}
</style>
</head>
<body>
<header>
  <span class="dot" id="statusDot"></span>
  <h1>MY&nbsp;SON</h1>
  <span class="meta" id="statusMeta">connecting…</span>
</header>

<div class="wrap">
  <div class="col">
    <div class="panel" id="chat">
      <h2>chat <span class="pill" id="routePill">—</span></h2>
      <div class="body" id="transcript"></div>
      <div class="composer">
        <textarea id="input" placeholder="message myson…  (/think, /fast, /tools to steer)"></textarea>
        <button id="send">Send</button>
        <button id="think" class="ghost" title="Run the full reasoning loop and show the scratchpad">🧠 Think</button>
      </div>
    </div>
    <div class="panel" id="scratch">
      <h2>reasoning scratchpad <span class="pill" id="haltPill"></span></h2>
      <div class="body" id="trace"><p class="empty">Hit 🧠 Think on a hard question to watch myson sample → verify → backtrack → redraft.</p></div>
    </div>
  </div>

  <div class="col">
    <div class="panel" style="flex:1">
      <h2>memory <button class="ghost" id="memRefresh">refresh</button></h2>
      <div class="body">
        <div class="row" style="margin-bottom:9px">
          <input type="text" id="memQ" placeholder="recall… (leave blank for recent)">
          <button class="ghost" id="memGo">search</button>
        </div>
        <div id="memList"><p class="empty">loading…</p></div>
      </div>
    </div>
    <div class="panel" style="flex:1">
      <h2>SEAL review queue <button class="ghost" id="sealRefresh">refresh</button></h2>
      <div class="body" id="sealList"><p class="empty">loading…</p></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const history = [];

async function refreshStatus(){
  try{
    const h = await (await fetch('/health')).json();
    $('#statusDot').classList.toggle('on', !!h.mind_stone_reachable);
    $('#statusMeta').textContent = `${h.model} · ${h.mind_stone_reachable?'ready':'model runtime not ready'}`
      + (h.placement && h.placement !== 'not loaded yet' ? ` · ${h.placement}` : '')
      + ` · embeddings ${h.embeddings?'on':'off (text-cosine)'}`;
  }catch(e){ $('#statusMeta').textContent = 'server unreachable'; }
}

function addMsg(who, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (who==='you'?'user':'myson');
  d.innerHTML = `<div class="who">${who}</div><div class="bubble">${esc(text)}</div>`;
  $('#transcript').appendChild(d);
  $('#transcript').scrollTop = $('#transcript').scrollHeight;
  return d.querySelector('.bubble');
}

async function send(){
  const text = $('#input').value.trim();
  if(!text) return;
  $('#input').value='';
  $('#send').disabled = true;
  addMsg('you', text);
  history.push({role:'user', content:text});
  const bubble = addMsg('myson', '');
  let acc = '';
  try{
    const res = await fetch('/v1/chat/completions', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages:history, stream:true})
    });
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf='';
    while(true){
      const {value, done} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while((i = buf.indexOf('\n\n')) >= 0){
        const line = buf.slice(0, i).trim(); buf = buf.slice(i+2);
        if(!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if(payload === '[DONE]') continue;
        try{
          const obj = JSON.parse(payload);
          const piece = obj.choices?.[0]?.delta?.content || '';
          if(piece){ acc += piece; bubble.textContent = acc; $('#transcript').scrollTop = $('#transcript').scrollHeight; }
        }catch(_){}
      }
    }
  }catch(e){ bubble.textContent = '[error] ' + e; }
  history.push({role:'assistant', content:acc});
  $('#send').disabled = false;
  refreshMemory();
}

async function think(){
  const text = $('#input').value.trim() || (history.filter(m=>m.role==='user').slice(-1)[0]||{}).content;
  if(!text){ return; }
  const msgs = history.concat($('#input').value.trim()? [{role:'user', content:text}] : []);
  $('#trace').innerHTML = '<p class="empty">thinking…</p>';
  $('#haltPill').textContent = '';
  try{
    const t = await (await fetch('/myson/think', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({messages: msgs.length?msgs:[{role:'user',content:text}]})
    })).json();
    if(t.error){ $('#trace').innerHTML = `<p class="empty">${esc(t.error)}</p>`; return; }
    renderTrace(t);
  }catch(e){ $('#trace').innerHTML = `<p class="empty">${esc(''+e)}</p>`; }
}

function renderTrace(t){
  let h = '';
  (t.steps||[]).forEach(s=>{
    const sc = (s.scores||[]).map(x=>x.toFixed(2)).join(', ');
    h += `<div class="step ${esc(s.kind)}">pass ${s.pass_idx} · <b>${esc(s.kind)}</b> `
       + `· best ${s.best_score.toFixed(2)} <span class="sc">[${sc}]</span>`
       + (s.chosen? `<br>${esc(s.chosen.slice(0,160))}`:'') + `</div>`;
  });
  if(!h) h = '<p class="empty">no steps recorded.</p>';
  h += `<div class="halt">halt: ${esc(t.halt_reason)} · passes ${t.passes} · backtracks ${t.n_backtracks} · ${t.llm_calls} llm calls</div>`;
  $('#trace').innerHTML = h;
  $('#haltPill').textContent = t.halt_reason || '';
}

async function refreshMemory(){
  const q = $('#memQ').value.trim();
  try{
    const url = q? `/myson/memory?q=${encodeURIComponent(q)}&k=10` : '/myson/memory?k=15';
    const m = await (await fetch(url)).json();
    const items = q? (m.recalled||[]).map(t=>({role:'recalled', text:t})) : (m.recent||[]);
    $('#memList').innerHTML = items.length
      ? items.map(it=>`<div class="memitem"><div class="who">${esc(it.role||'')}</div>${esc(it.text||it)}</div>`).join('')
      : '<p class="empty">nothing yet.</p>';
  }catch(e){ $('#memList').innerHTML = `<p class="empty">${esc(''+e)}</p>`; }
}

async function refreshSeal(){
  try{
    const s = await (await fetch('/myson/seal')).json();
    const pend = s.pending||[];
    let h = pend.length ? pend.map(it=>`
      <div class="review" data-id="${esc(it.id)}">
        <div class="id">${esc(it.id)} · ${esc(it.kind||'')} · ${esc(it.status||'')}</div>
        <div>${esc((it.goal||'').slice(0,120))}</div>
        <div class="acts">
          <button class="ghost" data-id="${esc(it.id)}" data-act="approve">approve</button>
          <button class="ghost" data-id="${esc(it.id)}" data-act="reject">reject</button>
          <button class="ghost" data-id="${esc(it.id)}" data-act="apply">apply</button>
        </div>
      </div>`).join('') : '<p class="empty">no pending self-edits. (SEAL proposes; you approve.)</p>';
    if((s.versions||[]).length) h += `<div class="pill" style="margin-top:6px">rule-store versions: ${s.versions.length}</div>`;
    $('#sealList').innerHTML = h;
  }catch(e){ $('#sealList').innerHTML = `<p class="empty">${esc(''+e)}</p>`; }
}

async function sealAct(id, action){
  try{ await fetch(`/myson/seal/${encodeURIComponent(id)}/${encodeURIComponent(action)}`, {method:'POST'}); }catch(e){}
  refreshSeal();
}
// event delegation — no inline handlers, no interpolated ids in markup
$('#sealList').addEventListener('click', e=>{
  const b = e.target.closest('button[data-id]');
  if(b) sealAct(b.dataset.id, b.dataset.act);
});

$('#send').onclick = send;
$('#think').onclick = think;
$('#memRefresh').onclick = refreshMemory;
$('#memGo').onclick = refreshMemory;
$('#sealRefresh').onclick = refreshSeal;
$('#input').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }});

refreshStatus(); refreshMemory(); refreshSeal();
setInterval(refreshStatus, 15000);
</script>
</body>
</html>
